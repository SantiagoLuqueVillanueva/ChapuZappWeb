<form
  (ngSubmit)="onSubmit($event)"
  class="flex w-full flex-col gap-2 rounded-2xl border border-line bg-surface p-2 shadow-sm transition-shadow focus-within:shadow-md sm:flex-row sm:items-center sm:gap-0 sm:rounded-full sm:p-1.5"
  role="search"
  aria-label="Buscar servicios o profesionales"
>
  <!-- Campo 1: Qué necesitas arreglar -->
  <div class="relative flex flex-1 items-center px-3 py-2 sm:py-1">
    <svg
      class="size-5 shrink-0 text-muted"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
      />
    </svg>
    <input
      type="text"
      name="query"
      [(ngModel)]="query"
      [placeholder]="placeholderQuery"
      class="w-full bg-transparent pl-3 text-body text-ink placeholder:text-muted focus:outline-none"
      aria-label="Servicio o avería que necesitas solucionar"
    />
  </div>

  <!-- Separador vertical (solo pantallas medianas/grandes) -->
  <div class="hidden h-7 w-px bg-line sm:block" aria-hidden="true"></div>

  <!-- Campo 2: Código postal o ciudad -->
  <div
    class="relative flex flex-1 items-center border-t border-line px-3 py-2 sm:border-t-0 sm:py-1"
  >
    <svg
      class="size-5 shrink-0 text-muted"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
      />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
      />
    </svg>
    <input
      type="text"
      name="location"
      [(ngModel)]="location"
      [placeholder]="placeholderLocation"
      class="w-full bg-transparent pl-3 text-body text-ink placeholder:text-muted focus:outline-none"
      aria-label="Código postal o ciudad"
    />
  </div>

  <!-- Botón de acción Buscar -->
  <button
    type="submit"
    class="flex items-center justify-center rounded-xl bg-ink px-6 py-2.5 font-display text-card-title font-semibold text-white transition-opacity hover:opacity-90 active:scale-[0.98] sm:rounded-full sm:px-7 sm:py-2.5"
  >
    {{ buttonText }}
  </button>
</form>
