@if (foto()) {
  <img
    [src]="foto()"
    [alt]="nombre()"
    class="rounded-full object-cover shrink-0"
    [class]="sizeClasses[size()]"
  />
} @else {
  <div
    class="flex shrink-0 items-center justify-center rounded-full bg-card font-display font-bold text-ink"
    [class]="sizeClasses[size()]"
  >
    {{ iniciales() }}
  </div>
}
