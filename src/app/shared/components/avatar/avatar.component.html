@if (foto()) {
  <img
    [src]="foto()"
    [alt]="nombre()"
    class="rounded-full object-cover"
    [class]="sizeClasses[size()]"
  />
} @else {
  <div
    class="flex items-center justify-center rounded-full bg-surface font-display font-semibold text-ink"
    [class]="sizeClasses[size()]"
  >
    {{ iniciales() }}
  </div>
}
