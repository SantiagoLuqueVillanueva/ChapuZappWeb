<div class="space-y-6">
  <div class="space-y-1">
    <h1 class="font-display text-h1 font-bold text-ink">Crear cuenta</h1>
    <p class="text-body text-muted">Únete a ChapuZapp como cliente o profesional</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="registrarse()" novalidate class="space-y-4">
    <app-form-field label="Nombre completo" inputId="reg-name" [error]="error('nombre')">
      <input
        id="reg-name"
        type="text"
        formControlName="nombre"
        autocomplete="name"
        placeholder="Juan Pérez"
        [class.border-red-500]="error('nombre')"
        class="w-full rounded-xl border border-line bg-surface px-4 py-3 text-body text-ink placeholder:text-muted focus:border-accent focus:outline-none"
      />
    </app-form-field>

    <app-form-field label="Correo electrónico" inputId="reg-email" [error]="error('email')">
      <input
        id="reg-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="ejemplo@correo.com"
        [class.border-red-500]="error('email')"
        class="w-full rounded-xl border border-line bg-surface px-4 py-3 text-body text-ink placeholder:text-muted focus:border-accent focus:outline-none"
      />
    </app-form-field>

    <app-form-field label="Contraseña" inputId="reg-password" [error]="error('password')">
      <input
        id="reg-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
        [class.border-red-500]="error('password')"
        class="w-full rounded-xl border border-line bg-surface px-4 py-3 text-body text-ink placeholder:text-muted focus:border-accent focus:outline-none"
      />
    </app-form-field>

    <app-form-field
      label="Repetir contraseña"
      inputId="reg-repetir-password"
      [error]="error('repetirPassword')"
    >
      <input
        id="reg-repetir-password"
        type="password"
        formControlName="repetirPassword"
        autocomplete="new-password"
        placeholder="Escribe otra vez la contraseña"
        [class.border-red-500]="error('repetirPassword')"
        class="w-full rounded-xl border border-line bg-surface px-4 py-3 text-body text-ink placeholder:text-muted focus:border-accent focus:outline-none"
      />
    </app-form-field>

    <fieldset class="space-y-1.5">
      <legend class="font-display text-card-title font-medium text-ink">Tipo de cuenta</legend>
      <div class="grid grid-cols-2 gap-3">
        <label
          for="rol-cliente"
          [class]="
            form.controls.rol.value === 'CLIENTE'
              ? 'border-accent bg-card'
              : 'border-line bg-surface'
          "
          class="flex cursor-pointer items-center justify-center gap-2.5 rounded-xl border p-3 text-body font-medium text-ink transition-colors hover:border-accent"
        >
          <input
            id="rol-cliente"
            type="radio"
            formControlName="rol"
            value="CLIENTE"
            class="sr-only"
          />
          <span
            class="flex size-4 items-center justify-center rounded-full border border-line bg-white transition-colors"
            [class]="
              form.controls.rol.value === 'CLIENTE'
                ? 'border-accent ring-2 ring-accent/20'
                : 'border-muted/40'
            "
          >
            @if (form.controls.rol.value === 'CLIENTE') {
              <span class="size-2.5 rounded-full bg-accent"></span>
            }
          </span>
          <span>Cliente</span>
        </label>
        <label
          for="rol-profesional"
          [class]="
            form.controls.rol.value === 'PROFESIONAL'
              ? 'border-accent bg-card'
              : 'border-line bg-surface'
          "
          class="flex cursor-pointer items-center justify-center gap-2.5 rounded-xl border p-3 text-body font-medium text-ink transition-colors hover:border-accent"
        >
          <input
            id="rol-profesional"
            type="radio"
            formControlName="rol"
            value="PROFESIONAL"
            class="sr-only"
          />
          <span
            class="flex size-4 items-center justify-center rounded-full border border-line bg-white transition-colors"
            [class]="
              form.controls.rol.value === 'PROFESIONAL'
                ? 'border-accent ring-2 ring-accent/20'
                : 'border-muted/40'
            "
          >
            @if (form.controls.rol.value === 'PROFESIONAL') {
              <span class="size-2.5 rounded-full bg-accent"></span>
            }
          </span>
          <span>Profesional</span>
        </label>
      </div>
    </fieldset>

    @if (errorRegistro()) {
      <p role="alert" class="rounded-xl bg-red-50 px-4 py-3 text-caption text-red-700">
        {{ errorRegistro() }}
      </p>
    }

    <div class="pt-2">
      <app-button
        type="submit"
        variant="primary"
        size="md"
        [disabled]="cargando()"
        class="block w-full [&>button]:w-full"
      >
        {{ cargando() ? 'Creando cuenta...' : 'Registrarse' }}
      </app-button>
    </div>
  </form>

  <div class="border-t border-line pt-4 text-center text-body text-muted">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="font-semibold text-accent hover:underline">Inicia sesión</a>
  </div>
</div>
