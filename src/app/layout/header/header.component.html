<header class="sticky top-0 z-50 border-b border-line bg-surface/90 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-center">
      <img src="/images/logo-horizontal.svg" alt="ChapuZapp" class="h-8 w-auto sm:h-9" />
    </a>

    <nav class="hidden items-center gap-8 md:flex" aria-label="Navegación principal">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="text-ink font-semibold border-b-2 border-ink"
        class="pb-1 text-body font-medium text-muted transition-colors hover:text-ink"
      >
        Inicio
      </a>
      <a
        routerLink="/buscar"
        routerLinkActive="text-ink font-semibold border-b-2 border-ink"
        class="pb-1 text-body font-medium text-muted transition-colors hover:text-ink"
      >
        Búsqueda
      </a>
      <a
        routerLink="/mis-citas"
        routerLinkActive="text-ink font-semibold border-b-2 border-ink"
        class="pb-1 text-body font-medium text-muted transition-colors hover:text-ink"
      >
        Para profesionales
      </a>
      <a
        routerLink="/mensajes"
        routerLinkActive="text-ink font-semibold border-b-2 border-ink"
        class="pb-1 text-body font-medium text-muted transition-colors hover:text-ink"
      >
        Chats
      </a>
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      @if (auth.usuario(); as usuario) {
        <div class="relative">
          <button
            type="button"
            (click)="alternarMenu()"
            [attr.aria-expanded]="menuAbierto()"
            aria-haspopup="menu"
            class="flex cursor-pointer items-center gap-2 rounded-full p-1 pr-3 transition-colors hover:bg-card"
          >
            <app-avatar [nombre]="usuario.nombre" [foto]="usuario.foto" size="sm" />
            <span class="hidden text-body font-medium text-ink sm:inline">{{
              usuario.nombre
            }}</span>
          </button>

          @if (menuAbierto()) {
            <div
              role="menu"
              class="absolute right-0 mt-2 w-48 overflow-hidden rounded-xl border border-line bg-surface shadow-lg"
            >
              <a
                routerLink="/perfil"
                (click)="cerrarMenu()"
                role="menuitem"
                class="block px-4 py-2 text-body text-ink hover:bg-card"
              >
                Mi perfil
              </a>
              <a
                routerLink="/mis-citas"
                (click)="cerrarMenu()"
                role="menuitem"
                class="block px-4 py-2 text-body text-ink hover:bg-card"
              >
                Mis citas
              </a>
              <button
                type="button"
                (click)="cerrarSesion()"
                role="menuitem"
                class="block w-full cursor-pointer border-t border-line px-4 py-2 text-left text-body text-ink hover:bg-card"
              >
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login">
          <app-button variant="secondary" size="sm">Iniciar sesión</app-button>
        </a>
        <a routerLink="/registro">
          <app-button variant="primary" size="sm">Registrarse</app-button>
        </a>
      }
    </div>
  </div>
</header>
